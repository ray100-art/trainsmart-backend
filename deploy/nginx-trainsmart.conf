# TrainSMART — nginx site config (Ubuntu/Debian)
# Install: sudo cp nginx-trainsmart.conf /etc/nginx/sites-available/trainsmart
#          sudo ln -s /etc/nginx/sites-available/trainsmart /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   - SSL certs (certbot): nhcsc.nascop.org
#   - Frontend built:      cd trainsmart-frontend && npm run build
#   - Backend running:     uvicorn on 127.0.0.1:8000 (see systemd unit)

upstream trainsmart_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name nhcsc.nascop.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nhcsc.nascop.org;

    # Certbot paths — adjust if using MOH internal PKI
    ssl_certificate     /etc/letsencrypt/live/nhcsc.nascop.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nhcsc.nascop.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Frontend static build
    root /var/www/trainsmart/frontend/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → FastAPI
    location /api/ {
        proxy_pass http://trainsmart_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Health check (no /api prefix on backend root routes)
    location /health {
        proxy_pass http://trainsmart_api;
        proxy_set_header Host $host;
    }

    # SPA — React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
