services:
  postgres:
    image: postgres:16-alpine
    container_name: trainsmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trainsmart
      POSTGRES_USER: trainsmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - trainsmart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainsmart -d trainsmart"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  trainsmart_pgdata:
